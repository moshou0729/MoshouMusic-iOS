name: MoshouMusic
options:
  bundleIdPrefix: com.moshou
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MoshouMusic:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: MoshouMusic
        excludes:
          - "Resources/default_scripts"
          - "Resources/lx_compat"
      - path: MoshouMusic/Resources/default_scripts
        type: folder
      - path: MoshouMusic/Resources/lx_compat
        type: folder
    info:
      path: MoshouMusic/App/Info.plist
      properties:
        CFBundleDisplayName: 墨守music
        CFBundleShortVersionString: "1.0.50"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: PrimaryColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        NSMicrophoneUsageDescription: 墨守music需要音频权限以播放音乐
        NSPhotoLibraryUsageDescription: 墨守music需要相册权限以保存封面
        NSAppleMusicUsageDescription: 墨守music需要音乐权限以播放音乐
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: LX Music Playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.moshou.music.lxmc
          - CFBundleTypeName: JSON Playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.moshou.music.lxmc
            UTTypeDescription: LX Music Compressed Playlist
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - lxmc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moshou.music
        CODE_SIGN_ENTITLEMENTS: MoshouMusic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        SWIFT_OBJC_BRIDGING_HEADER: "MoshouMusic/MoshouMusic-Bridging-Header.h"
schemes:
  MoshouMusic:
    build:
      targets:
        MoshouMusic: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
